<svg width="100%" viewBox="0 0 680 330" role="img">
<title>Trader dashboard access flow with a blocked request</title>
<desc>A key turns to unlock JWT identity. An authorized blue request passes through the RBAC and ABAC gate into the live dashboard, while an unauthorized red request is stopped and denied at the gate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<path d="M96,168 A24,24 0 0 1 144,168" fill="none" stroke="#378ADD" stroke-width="5" stroke-linecap="round"/>
<g fill="#E6F1FB" stroke="#185FA5"><rect x="85" y="168" width="70" height="55" rx="8" stroke-width="0.5"/></g>
<circle cx="120" cy="192" r="5" fill="#FFFFFF"/>
<rect x="117" y="195" width="6" height="10" fill="#FFFFFF"/>
<g><animateTransform attributeName="transform" type="rotate" values="-15 120 192; 15 120 192; -15 120 192" dur="2.4s" repeatCount="indefinite"/>
<circle cx="100" cy="192" r="6" fill="#7F77DD"/>
<rect x="104" y="189" width="20" height="6" fill="#7F77DD"/>
<rect x="120" y="188" width="4" height="4" fill="#7F77DD"/>
<rect x="120" y="196" width="4" height="4" fill="#7F77DD"/>
</g>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="120" y="260" text-anchor="middle">JWT / OAuth2</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="120" y="276" text-anchor="middle">Auth foundation</text>

<g fill="#E1F5EE" stroke="#0F6E56"><rect x="260" y="140" width="10" height="110" rx="3" stroke-width="0.5"><animate attributeName="x" values="260;254;260" dur="3s" begin="0s" repeatCount="indefinite"/></rect></g>
<g fill="#FAECE7" stroke="#993C1D"><rect x="285" y="140" width="10" height="110" rx="3" stroke-width="0.5"><animate attributeName="x" values="285;285;285" dur="3s" begin="0.3s" repeatCount="indefinite"/></rect></g>
<g fill="#FAEEDA" stroke="#854F0B"><rect x="310" y="140" width="10" height="110" rx="3" stroke-width="0.5"><animate attributeName="x" values="310;316;310" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect></g>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="285" y="270" text-anchor="middle">RBAC / ABAC</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="285" y="286" text-anchor="middle">Role and team based access</text>

<line x1="150" y1="195" x2="420" y2="195" stroke="#73726c" stroke-width="0.5" opacity="0.35"/>

<circle r="5" fill="#378ADD"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M150,195 L420,195"/></circle>
<circle r="5" fill="#378ADD"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M150,195 L420,195"/></circle>

<circle r="5" fill="#E24B4A"><animateMotion dur="1.3s" begin="0.4s" repeatCount="indefinite" path="M150,165 L250,165"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.85;0.9;1" dur="1.3s" begin="0.4s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#E24B4A"><animateMotion dur="1.3s" begin="2.1s" repeatCount="indefinite" path="M150,165 L250,165"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.85;0.9;1" dur="1.3s" begin="2.1s" repeatCount="indefinite"/></circle>
<line x1="150" y1="165" x2="248" y2="165" stroke="#E24B4A" stroke-width="0.5" opacity="0.25"/>
<line x1="246" y1="159" x2="256" y2="169" stroke="#E24B4A" stroke-width="2" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.55;0.7" dur="1.7s" repeatCount="indefinite"/></line>
<line x1="246" y1="169" x2="256" y2="159" stroke="#E24B4A" stroke-width="2" stroke-linecap="round"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.55;0.7" dur="1.7s" repeatCount="indefinite"/></line>
<text x="252" y="150" font-size="12" fill="#A32D2D" text-anchor="middle">Denied</text>

<line x1="400" y1="195" x2="418" y2="195" stroke="#73726c" stroke-width="0.5" opacity="0.35" marker-end="url(#arrow)"/>

<rect x="420" y="90" width="200" height="170" rx="14" fill="#F1EFE8" stroke="#73726c" stroke-width="0.5"/>
<circle cx="600" cy="108" r="5" fill="#639922"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
<rect x="440" y="120" width="150" height="5" rx="2" fill="#73726c"/>
<rect x="440" y="136" width="150" height="5" rx="2" fill="#73726c"/>
<rect x="440" y="152" width="150" height="5" rx="2" fill="#73726c"/>
<rect x="440" y="198" width="20" height="40" fill="#378ADD"><animate attributeName="height" values="40;65;40" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="198;173;198" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="470" y="183" width="20" height="55" fill="#378ADD"><animate attributeName="height" values="55;30;55" dur="2.6s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="183;208;183" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></rect>
<rect x="500" y="203" width="20" height="35" fill="#378ADD"><animate attributeName="height" values="35;58;35" dur="2.2s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="203;180;203" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></rect>
<rect x="530" y="178" width="20" height="60" fill="#378ADD"><animate attributeName="height" values="60;42;60" dur="2.8s" begin="0.1s" repeatCount="indefinite"/><animate attributeName="y" values="178;196;178" dur="2.8s" begin="0.1s" repeatCount="indefinite"/></rect>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="520" y="278" text-anchor="middle">React trader dashboard</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="520" y="294" text-anchor="middle">Replaced 1k emails/min</text>
</svg>
