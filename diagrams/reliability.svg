<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 330" role="img">
<title>Reliability and visibility, illustrated</title>
<desc>Code rides a conveyor belt through a test scanner raising coverage to 90-95 percent, into a Docker and Kubernetes shipping container for release, and out into a control room with a radar sweep and status lights representing observability and on-call, giving 40 percent faster detection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="196" width="600" height="8" rx="4" fill="#F1EFE8" stroke="#73726c" stroke-width="0.5"/>
<line x1="40" y1="200" x2="640" y2="200" stroke="#73726c" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"><animate attributeName="stroke-dashoffset" values="0;-16" dur="0.6s" repeatCount="indefinite"/></line>

<g>
<animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M60,200 L600,200"/>
<rect x="-11" y="-9" width="22" height="18" rx="3" fill="#7F77DD"/>
<line x1="-6" y1="-3" x2="6" y2="-3" stroke="white" stroke-width="1.5"/>
<line x1="-6" y1="2" x2="3" y2="2" stroke="white" stroke-width="1.5"/>
</g>
<g>
<animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M60,200 L600,200"/>
<rect x="-11" y="-9" width="22" height="18" rx="3" fill="#7F77DD"/>
<line x1="-6" y1="-3" x2="6" y2="-3" stroke="white" stroke-width="1.5"/>
<line x1="-6" y1="2" x2="3" y2="2" stroke="white" stroke-width="1.5"/>
</g>

<rect x="188" y="140" width="4" height="120" fill="#73726c"/>
<rect x="208" y="140" width="4" height="120" fill="#73726c"/>
<line x1="192" y1="140" x2="208" y2="140" stroke="#EF9F27" stroke-width="2" opacity="0.8"><animate attributeName="y1" values="140;260;140" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y2" values="140;260;140" dur="1.4s" repeatCount="indefinite"/></line>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="200" y="280" text-anchor="middle">Test suite</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="200" y="296" text-anchor="middle">70% to 95% coverage</text>

<rect x="340" y="165" width="80" height="70" rx="6" fill="#F1EFE8" stroke="#73726c" stroke-width="0.5"/>
<line x1="350" y1="165" x2="350" y2="235" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<line x1="362" y1="165" x2="362" y2="235" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<line x1="374" y1="165" x2="374" y2="235" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<line x1="380" y1="165" x2="380" y2="235" stroke="#73726c" stroke-width="1"/>
<line x1="386" y1="165" x2="386" y2="235" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<line x1="398" y1="165" x2="398" y2="235" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<line x1="410" y1="165" x2="410" y2="235" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="380" y="280" text-anchor="middle">Docker + Kubernetes</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="380" y="296" text-anchor="middle">Containerized releases</text>

<rect x="500" y="150" width="120" height="100" rx="10" fill="#F1EFE8" stroke="#73726c" stroke-width="0.5"/>
<circle cx="560" cy="190" r="22" fill="none" stroke="#73726c" stroke-width="0.5"/>
<g><animateTransform attributeName="transform" type="rotate" values="0 560 190;360 560 190" dur="2s" repeatCount="indefinite"/>
<line x1="560" y1="190" x2="560" y2="168" stroke="#3B8BD4" stroke-width="2" stroke-linecap="round"/>
</g>
<circle cx="540" cy="225" r="4" fill="#639922"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="225" r="4" fill="#639922"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
<circle cx="580" cy="225" r="4" fill="#639922"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="560" y="280" text-anchor="middle">Observability</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="560" y="296" text-anchor="middle">40% faster on-call</text>
</svg>
