<svg width="100%" viewBox="0 0 680 460" role="img">
<title>LLM extraction and agentic query system, illustrated</title>
<desc>A raw WhatsApp order message is extracted by Claude Haiku into structured data, which is written to both a Postgres store and a Qdrant embedding index. An agentic router then decides per query whether to hit the structured store or the semantic index.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g fill="#FAECE7" stroke="#993C1D">
<rect x="50" y="70" width="130" height="60" rx="12" stroke-width="0.5"/>
<path d="M60,130 L75,130 L60,145 Z" stroke-width="0.5"/>
</g>
<rect x="65" y="86" width="90" height="4" rx="2" fill="#73726c"/>
<rect x="65" y="100" width="60" height="4" rx="2" fill="#73726c"/>
<rect x="65" y="114" width="100" height="4" rx="2" fill="#73726c"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="115" y="150" text-anchor="middle">WhatsApp order</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="115" y="166" text-anchor="middle">Raw text</text>

<line x1="182" y1="100" x2="216" y2="100" stroke="#73726c" stroke-width="0.5" opacity="0.5" marker-end="url(#arrow)"/>

<g fill="#EEEDFE" stroke="#534AB7"><rect x="220" y="70" width="140" height="60" rx="10" stroke-width="0.5"/></g>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="290" y="92" text-anchor="middle">Claude Haiku</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="290" y="110" text-anchor="middle">Extracts structured data</text>
<g>
<line x1="345" y1="72" x2="345" y2="82" stroke="#7F77DD" stroke-width="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></line>
<line x1="340" y1="77" x2="350" y2="77" stroke="#7F77DD" stroke-width="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></line>
</g>

<line x1="362" y1="100" x2="396" y2="100" stroke="#73726c" stroke-width="0.5" opacity="0.5" marker-end="url(#arrow)"/>

<rect x="400" y="70" width="130" height="60" rx="8" fill="#F1EFE8" stroke="#73726c" stroke-width="0.5"/>
<rect x="412" y="86" width="106" height="4" rx="2" fill="#73726c"/>
<rect x="412" y="100" width="106" height="4" rx="2" fill="#73726c"/>
<rect x="412" y="114" width="106" height="4" rx="2" fill="#73726c"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="465" y="150" text-anchor="middle">Structured order</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="465" y="166" text-anchor="middle">Name, items, total</text>

<line x1="465" y1="130" x2="465" y2="170" stroke="#73726c" stroke-width="0.5" opacity="0.35"/>
<path d="M465,170 L260,170 L260,195" fill="none" stroke="#73726c" stroke-width="0.5" opacity="0.35" marker-end="url(#arrow)"/>
<path d="M465,170 L520,170 L520,188" fill="none" stroke="#73726c" stroke-width="0.5" opacity="0.35" marker-end="url(#arrow)"/>

<path d="M205,210 A55,13 0 0 0 315,210 L315,270 A55,13 0 0 1 205,270 Z" fill="#1D9E75" fill-opacity="0.15" stroke="#0F6E56" stroke-width="0.5"/>
<ellipse cx="260" cy="210" rx="55" ry="13" fill="#1D9E75" fill-opacity="0.3" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="260" y="308" text-anchor="middle">Postgres</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="260" y="324" text-anchor="middle">Structured, source of truth</text>

<circle cx="520" cy="240" r="50" fill="none" stroke="#73726c" stroke-width="0.5" stroke-dasharray="4 3"/>
<circle cx="500" cy="222" r="3" fill="#D85A30" opacity="0.5"/>
<circle cx="538" cy="218" r="3" fill="#D85A30" opacity="0.5"/>
<circle cx="548" cy="248" r="3" fill="#D85A30" opacity="0.5"/>
<circle cx="488" cy="242" r="3" fill="#D85A30" opacity="0.5"/>
<circle cx="540" cy="265" r="3" fill="#D85A30" opacity="0.5"/>
<circle cx="508" cy="272" r="3" fill="#D85A30" opacity="0.5"/>
<circle cx="498" cy="258" r="4" fill="#D85A30"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="524" cy="232" r="5" fill="#D85A30"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="520" y="308" text-anchor="middle">Qdrant</text>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="520" y="324" text-anchor="middle">Order embeddings</text>

<g fill="#E6F1FB" stroke="#185FA5"><rect x="340" y="345" width="100" height="40" rx="8" stroke-width="0.5"/></g>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="390" y="365" text-anchor="middle" dominant-baseline="central">Agentic router</text>

<line x1="472" y1="365" x2="442" y2="365" stroke="#73726c" stroke-width="0.5" opacity="0.5" marker-end="url(#arrow)"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5F5E5A" x="478" y="369">Query</text>

<path d="M350,345 L350,292 L260,292 L260,281" fill="none" stroke="#73726c" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.4" marker-end="url(#arrow)"/>
<path d="M430,345 L430,292 L520,292 L520,288" fill="none" stroke="#73726c" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.4" marker-end="url(#arrow)"/>

<line x1="390" y1="385" x2="390" y2="408" stroke="#73726c" stroke-width="0.5" opacity="0.5" marker-end="url(#arrow)"/>
<rect x="340" y="410" width="100" height="30" rx="8" fill="#F1EFE8" stroke="#73726c" stroke-width="0.5"/>
<text font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" x="390" y="425" text-anchor="middle" dominant-baseline="central">Answer</text>

<circle r="5" fill="#7F77DD"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M180,100 L400,100"/></circle>
<circle r="4" fill="#1D9E75"><animateMotion dur="1.2s" begin="1.6s" repeatCount="indefinite" path="M465,170 L260,170 L260,195"/></circle>
<circle r="4" fill="#D85A30"><animateMotion dur="1.2s" begin="1.6s" repeatCount="indefinite" path="M465,170 L520,170 L520,188"/></circle>
<circle r="5" fill="#1D9E75"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M472,365 L390,365 L350,345 L350,292 L260,292 L260,281"/></circle>
<circle r="5" fill="#D85A30"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M472,365 L390,365 L430,345 L430,292 L520,292 L520,288"/></circle>
</svg>
